{% extends 'base.html' %}

{% block content %}
    <div>
        <h2>Delete Memory</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="delete-btn btn-danger" type="submit">Delete</button>
            <a class="btn btn-primary" href="{% url 'memories:detail' object.pk %}">
                <button class="btn btn-primary" type="button">Paw Back</button>
            </a>
        </form>
    </div>
{% endblock %}
