{% extends 'base.html' %}

{% block content %}
    <div class="form-card">
        <h2>Delete Memory</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="delete-btn btn btn-danger" type="submit">Delete</button>
            <a class="btn btn-primary" href="{% url 'memories:detail' object.pk %}">Paw Back</a>
        </form>
    </div>
{% endblock %}
