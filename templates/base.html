{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😻</text></svg>">
    <title>CatSpace</title>
</head>

<body>
<header class="p-3">
    {% include "common/navigation.html" %}
    {% block header %}
        <h1><a href="{% url 'home' %}"><i class="fa-brands fa-napster"></i></a> Welcome to Your CatSpace!</h1>
    {% endblock %}
</header>

<main class="m-5">
    {% block content %}
    {% endblock %}
</main>

<footer class="mt-5 mb-0 p-3">
    <div class="d-flex justify-content-between align-items-center flex-wrap">
        <span class="script">Made with &hearts; and a lot of purrs</span>
        <span>&copy; Copyright {% now "Y" %} CatSpace. All rights reserved.</span>
    </div>
</footer>
</body>
</html>
